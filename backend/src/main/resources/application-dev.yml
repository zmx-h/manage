# ============================================================================
#  开发环境（dev）
#  启动：java -jar xxx.jar --spring.profiles.active=dev  或 IDE 里直接运行
#  注意：application-local.yml 已被 .gitignore 忽略，个人机器差异放这里
# ============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:iecmp}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

mybatis-plus:
  configuration:
    # 开发环境把 SQL 打到控制台，方便排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.iecmp: debug
    org.springframework.web: info
    com.baomidou.mybatisplus: debug

jwt:
  secret: ${JWT_SECRET:dev-only-iecmp-jwt-secret-key-please-change-in-prod-32bytes}

repo:
  crypto:
    # 托管平台访问令牌的 AES 密钥（接口文档 8.2.2）。长度 16/24/32 时直接当 AES-128/192/256 用，
    # 其它长度先做 SHA-256 再取 32 字节。仅限本地开发使用，生产必须用环境变量注入。
    aes-key: ${IECMP_REPO_AES_KEY:dev-only-iecmp-repo-aes-key-please-change-in-prod}

iecmp:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081
