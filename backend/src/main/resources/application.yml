# ============================================================================
#  IECMP 创业中心管理平台 · 后端主配置
#  环境差异放在 application-{dev|prod}.yml，本文件只放与环境无关的配置
#  配置项清单见《IECMP-项目介绍与技术架构.md》7.3 节
# ============================================================================
server:
  port: 8080
  servlet:
    context-path: /api            # 统一前缀，接口文档中不再重复书写 /api
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: iecmp
  profiles:
    active: dev                   # 本地开发默认 dev；上线用 --spring.profiles.active=prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB          # 文档类上限，图片上限由业务层再校验（见接口文档 2.9）
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.iecmp.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto                # 数据库自增（见《数据库设计》1.1 节）
      table-underline: true
      insert-strategy: not_null
      update-strategy: not_null
      # ----------------------------------------------------------------------
      #  逻辑删除：全库 deleted 为 BIGINT，删除时写入本行 id（不是 1），
      #  并参与全部唯一索引，使「删除后同名数据可重新插入」。详见《数据库设计》1.5 节。
      #  —— 上线前务必用一个真实删除动作打印 SQL 确认；若 MyBatis-Plus 版本不生效，
      #     在 Mapper 中改用自定义 @Update 实现同样的效果。
      # ----------------------------------------------------------------------
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

# ============================================================================
#  业务自定义配置
# ============================================================================
jwt:
  secret: CHANGE_ME_iecmp_jwt_secret_key_at_least_32_bytes_long
  access-token-expire: 7200       # accessToken 有效期（秒），2 小时
  refresh-token-expire: 604800    # refreshToken 有效期（秒），7 天
  refresh-renew-threshold: 86400  # refreshToken 剩余不足 1 天时滑动续期（秒）
  header: Authorization
  prefix: "Bearer "

upload:
  max-image-size: 5242880         # 图片上限 5MB
  max-doc-size: 20971520          # 文档上限 20MB
  # 本地联调存储；生产可将 url-prefix 换成 OSS/CDN 地址
  local-dir: ./upload
  url-prefix: /api/upload

oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  bucket: iecmp-upload
  access-key-id: ""
  access-key-secret: ""
  url-prefix: https://iecmp-upload.oss-cn-hangzhou.aliyuncs.com

jellyfin:
  base-url: ""                    # 拼接视频播放链接用，留空表示未配置

iecmp:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  auth:
    # 无需登录即可访问的路径（不含 context-path）；** 表示任意多级
    # 与接口文档「是否需令牌 = 否」的 9 个公开接口一一对应
    ignore-urls:
      - /admin/login
      - /user/login
      - /user/token/refresh
      - /user/register
      - /common/register/config
      - /common/register/apply
      - /common/dict/**
      - /common/captcha
      - /common/health
      - /upload/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /doc.html
      - /error

    # 令牌可选路径：带了令牌就解析并写入上下文，没带也放行
    # 与接口文档「是否需令牌 = 可选」的 5 个接口一一对应
    optional-urls:
      - /user/honor/alumni/*
      - /user/honor/alumni/page
      - /user/honor/stat
      - /user/video/list

  # 注册入口开关（接口 1-22）：部署配置，不落数据库
  register:
    invite-enabled: 1
    apply-enabled: 1
    captcha-enabled: 0
    tips: "仅限创业中心内部成员使用"

# ----------------------------------------------------------------------------
#  模块二：代码仓库关联（架构文档 7.3 节 / 接口文档第 8 章）
#  repo.crypto.aes-key 属于密钥，只在 application-{dev|prod}.yml 里给
# ----------------------------------------------------------------------------
repo:
  contribution:
    # 贡献度公式（接口文档 8.4.4）：提交数 × commit + 活跃天数 × active-day + 代码行数 × code-line
    # 「代码行数」口径为 add_lines + del_lines（总变更行数），见 RepoProperties 说明
    weight:
      commit: 1
      active-day: 2
      code-line: 0.01

  sync:
    cron: "0 0 1 * * ?"           # 每日 01:00；同时用于计算接口 2-06 的 nextSyncTime
    lock-ttl-seconds: 1800        # 采集分布式锁 TTL，进程崩溃后自动释放
    request-interval-ms: 200      # 相邻两次第三方请求的间隔，按仓库维度串行限流
    commit-detail: true           # 是否再查一次提交详情补齐增删行数；关闭后 add_lines/del_lines 恒为 0
    max-pages: 20                 # 单个列表接口最多翻页数，防异常分页死循环
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
    max-retries: 2                # 第三方调用重试次数（不含首次），仅对 429/5xx 生效
    incremental-overlap-minutes: 5 # 增量采集向前回溯的分钟数，重复部分由 (project_id, commit_sha) 去重

  platform:
    # 顺序即接口 2-01 的返回顺序（与接口文档 8.2.1 的示例响应一致：GitHub 在前）
    # 这里列出的平台如果缺少对应的客户端实现，不会下发到 2-01，也不会被采集
    - code: github
      name: GitHub
      token-url: https://github.com/settings/tokens
      token-tip: "需勾选 repo 与 read:user 权限"
      api-base: https://api.github.com
      page-size: 100
    - code: gitee
      name: Gitee
      token-url: https://gitee.com/personal_access_tokens
      token-tip: "需勾选 projects 与 pull_requests 权限"
      api-base: https://gitee.com/api/v5
      page-size: 100
